<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Television viewer</title>
<!--
  Local viewer for the complete television: enclosure, panel, backlight,
  chassis, circuit boards, cables, wall mount, stand feet and remote.

  It reads output/stl/manifest.json (written by export.py) and loads every STL
  listed there, so new or renamed parts show up without editing this file.

  Browsers block file loading from a page opened by double-click, so serve the
  project folder first:

      python -m http.server 5173 --bind 127.0.0.1
      then open http://localhost:5173/

  three.js is loaded from a CDN (pinned version), so the first load needs
  internet access.
-->
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #dcdcd8; --accent: #c4621a; --button: #ececea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1d21; --panel: #25262b; --text: #ececee; --muted: #9a9aa2;
      --line: #393a41; --accent: #f08a3c; --button: #31323a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; overflow: hidden;
  }
  #panel {
    width: 320px; flex: none; background: var(--panel);
    border-right: 1px solid var(--line); padding: 16px; overflow-y: auto;
  }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  h2 {
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); margin: 18px 0 8px;
  }
  .sub { color: var(--muted); font-size: 12px; margin: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--text); background: var(--button);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); margin: 0; flex: none; }
  label.opt { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }

  details.group { border-bottom: 1px solid var(--line); }
  details.group > summary {
    display: flex; gap: 8px; align-items: center; padding: 7px 0; cursor: pointer;
    list-style: none; font-weight: 600;
  }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary .name { flex: 1; }
  details.group > summary .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  details.group > summary::after { content: "+"; color: var(--muted); width: 10px; text-align: center; }
  details.group[open] > summary::after { content: "\2212"; }
  .part {
    display: grid; grid-template-columns: auto 12px 1fr; gap: 8px;
    align-items: center; padding: 3px 0 3px 22px; cursor: pointer; font-size: 13px;
  }
  .part small { display: block; color: var(--muted); font-size: 11px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); }
  #hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
  #status { position: absolute; right: 12px; bottom: 10px; color: var(--muted); font-size: 12px; }
  #error {
    position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; padding: 24px; text-align: center;
  }
  #error div { max-width: 460px; }
  code { background: var(--button); padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 700px) {
    body { flex-direction: column-reverse; }
    #panel { width: 100%; max-height: 48%; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<aside id="panel">
  <h1>32 inch LED television</h1>
  <p class="sub" id="summary">Loading the model ...</p>

  <h2>Show</h2>
  <div class="row" id="presets">
    <button data-preset="all">Whole TV</button>
    <button data-preset="inside">Back cover off</button>
    <button data-preset="boards">Boards only</button>
    <button data-preset="backlight">Backlight</button>
    <button data-preset="mount">Wall mount</button>
    <button data-preset="remote">Remote</button>
  </div>

  <h2>View</h2>
  <div class="row">
    <button data-view="front">Front</button>
    <button data-view="back">Back</button>
    <button data-view="side">Side</button>
    <button data-view="top">Top</button>
    <button data-view="iso">Front 3/4</button>
    <button data-view="isoBack">Back 3/4</button>
  </div>

  <h2>Explode</h2>
  <input id="explode" type="range" min="0" max="1" step="0.01" value="0" aria-label="Explode amount">

  <h2>Parts</h2>
  <div id="groups"></div>

  <h2>Display</h2>
  <label class="opt"><input id="edges" type="checkbox" checked> Show edges</label>
  <label class="opt"><input id="wall" type="checkbox" checked> Show wall</label>
</aside>

<main id="stage">
  <div id="hint">Drag to rotate, scroll to zoom, right-drag to pan</div>
  <div id="status"></div>
  <div id="error"><div>
    <p><strong>Could not load the model.</strong></p>
    <p id="errorText" class="sub"></p>
    <p class="sub">Run <code>python export.py</code>, then <code>python -m http.server 5173 --bind 127.0.0.1</code>
      in the project folder and open <code>http://localhost:5173/</code>.</p>
  </div></div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";

const STL_FOLDER = "output/stl/";
const stage = document.getElementById("stage");
const statusLine = document.getElementById("status");
const dark = matchMedia("(prefers-color-scheme: dark)");

// ---- scene ---------------------------------------------------------------
// The model is Z-up: X along the wall, Y out from the wall, Z up.
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 5, 20000);
camera.up.set(0, 0, 1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x666670, 1.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
scene.add(key);                               // follows the camera, see the render loop

// A translucent sheet standing in for the wall, at Y = 0.
const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(1100, 700),
  new THREE.MeshBasicMaterial({ color: 0x8a8a90, transparent: true, opacity: 0.10,
                                side: THREE.DoubleSide, depthWrite: false }));
wall.rotation.x = Math.PI / 2;
wall.position.y = -0.3;
scene.add(wall);

function applyTheme() {
  scene.background = new THREE.Color(dark.matches ? 0x1c1d21 : 0xf4f4f2);
}
dark.addEventListener("change", applyTheme);
applyTheme();

// ---- parts ---------------------------------------------------------------
const parts = [];                             // { entry, group, mesh, edges, box }
const byGroup = new Map();                    // group name -> parts
const centre = new THREE.Vector3();
let radius = 400;

async function loadModel() {
  const response = await fetch(STL_FOLDER + "manifest.json");
  if (!response.ok) throw new Error("manifest.json not found (HTTP " + response.status + ")");
  const manifest = await response.json();
  const loader = new STLLoader();
  let done = 0;

  await Promise.all(manifest.parts.map(async (entry, index) => {
    const geometry = await loader.loadAsync(STL_FOLDER + entry.file);
    geometry.computeVertexNormals();
    const colour = new THREE.Color().setRGB(...entry.colour, THREE.SRGBColorSpace);
    const seeThrough = (entry.opacity ?? 1) < 1;
    const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
      color: colour, roughness: 0.7, metalness: 0.05,
      transparent: seeThrough, opacity: entry.opacity ?? 1, depthWrite: !seeThrough }));
    // Outline sharp edges so dark parts stay readable against each other.
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry, 35),
      new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
    const group = new THREE.Group();
    group.add(mesh, edges);
    group.visible = entry.visible !== false;
    scene.add(group);
    geometry.computeBoundingBox();
    parts.push({ entry, group, mesh, edges, colour, index, box: geometry.boundingBox.clone() });
    statusLine.textContent = `Loading ${++done} / ${manifest.parts.length}`;
  }));
  statusLine.textContent = "";

  parts.sort((a, b) => a.index - b.index);    // keep the manifest order
  for (const p of parts) {
    if (!byGroup.has(p.entry.group)) byGroup.set(p.entry.group, []);
    byGroup.get(p.entry.group).push(p);
  }

  buildPartTree();
  if (manifest.tv) {
    const tv = manifest.tv;
    document.getElementById("summary").textContent =
      `${tv.size_mm[0]} x ${tv.size_mm[2]} x ${tv.size_mm[1]} mm, about ${tv.mass_kg} kg, ` +
      `${parts.length} items. Reference design, not a real product.`;
  }
  applyPreset("all");
  setView("iso");
}

function label(name) {
  return name.replace(/_/g, " ");
}

function buildPartTree() {
  const root = document.getElementById("groups");
  for (const [groupName, members] of byGroup) {
    const details = document.createElement("details");
    details.className = "group";
    details.dataset.group = groupName;
    details.innerHTML = `
      <summary>
        <input type="checkbox">
        <span class="name">${groupName}</span>
        <span class="count">${members.length}</span>
      </summary>`;
    const master = details.querySelector("input");
    master.addEventListener("click", (e) => e.stopPropagation());   // do not fold the group
    master.addEventListener("change", () => {
      members.forEach((p) => setVisible(p, master.checked));
      frame();
    });

    for (const p of members) {
      const row = document.createElement("label");
      row.className = "part";
      const [sx, sy, sz] = p.entry.size_mm.map((v) => v.toFixed(0));
      const count = p.entry.count > 1 ? `${p.entry.count} pieces, ` : "";
      const note = p.entry.note ? `<small>${p.entry.note}</small>` : "";
      row.innerHTML = `
        <input type="checkbox">
        <span class="swatch" style="background:#${p.colour.getHexString()}"></span>
        <span>${label(p.entry.name)}
          <small>${count}${sx} x ${sy} x ${sz} mm, ${p.entry.mass_g} g</small>${note}</span>`;
      p.checkbox = row.querySelector("input");
      p.checkbox.addEventListener("change", () => {
        setVisible(p, p.checkbox.checked);
        frame();
      });
      details.append(row);
    }
    root.append(details);
  }
  syncCheckboxes();
}

function setVisible(p, on) {
  p.group.visible = on;
}

function syncCheckboxes() {
  for (const p of parts) p.checkbox.checked = p.group.visible;
  for (const details of document.querySelectorAll("details.group")) {
    const members = byGroup.get(details.dataset.group);
    const shown = members.filter((p) => p.group.visible).length;
    const master = details.querySelector("summary input");
    master.checked = shown === members.length;
    master.indeterminate = shown > 0 && shown < members.length;
  }
}

// ---- presets: which parts are shown ---------------------------------------
const BOARD_GROUPS = ["Main board", "Power supply board", "T-con board", "LED driver board",
                      "Wi-Fi / Bluetooth module", "IR / LED / key board"];
const PRESETS = {
  // everything that is fitted, plus the remote
  all: (p) => p.entry.group !== "Stand feet",
  // rear cover and wall mount removed, so the boards are visible from the back
  inside: (p) => !["Stand feet", "Wall mount", "Remote control"].includes(p.entry.group)
                 && !["rear_cover", "cover_screws"].includes(p.entry.name),
  boards: (p) => BOARD_GROUPS.includes(p.entry.group) || p.entry.group === "Cables",
  backlight: (p) => ["back_chassis", "led_strips", "led_chips", "led_lenses", "reflector_sheet",
                     "support_pins"].includes(p.entry.name),
  mount: (p) => p.entry.group === "Wall mount",
  remote: (p) => p.entry.group === "Remote control",
};
const PRESET_VIEW = { all: "iso", inside: "isoBack", boards: "back", backlight: "iso",
                      mount: "isoBack", remote: "iso" };

function applyPreset(name) {
  parts.forEach((p) => setVisible(p, PRESETS[name](p)));
  document.querySelectorAll("[data-preset]").forEach((b) =>
    b.classList.toggle("on", b.dataset.preset === name));
  syncCheckboxes();
  frame();
  setView(PRESET_VIEW[name]);
}
document.querySelectorAll("[data-preset]").forEach((button) =>
  button.addEventListener("click", () => applyPreset(button.dataset.preset)));

// ---- camera ----------------------------------------------------------------
// Fit the camera to whatever is visible right now.
function frame() {
  const box = new THREE.Box3();
  for (const p of parts) {
    if (!p.group.visible) continue;
    box.union(p.box.clone().translate(p.group.position));
  }
  if (box.isEmpty()) return;
  box.getCenter(centre);
  radius = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 20);
  syncCheckboxes();
}

const VIEWS = {                               // direction from the model to the camera
  front: [0, 1, 0],                           // from the room, looking at the screen
  back: [0, -1, 0],                           // from behind the wall
  side: [1, 0, 0],
  top: [0, 0.001, 1],                         // tiny Y so "up" stays defined
  iso: [-0.6, 1, 0.35],
  isoBack: [0.6, -1, 0.35],
};
let currentView = "iso";

function setView(name) {
  currentView = name;
  const direction = new THREE.Vector3(...VIEWS[name]).normalize();
  const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
  controls.target.copy(centre);
  camera.position.copy(centre).addScaledVector(direction, distance);
  camera.near = Math.max(distance / 500, 1);
  camera.far = distance * 20;
  camera.updateProjectionMatrix();
  controls.update();
}
document.querySelectorAll("[data-view]").forEach((button) =>
  button.addEventListener("click", () => { frame(); setView(button.dataset.view); }));

document.getElementById("explode").addEventListener("input", (e) => {
  const amount = Number(e.target.value);
  for (const p of parts) {
    const [x, y, z] = p.entry.explode ?? [0, 0, 0];
    p.group.position.set(x * amount, y * amount, z * amount);
  }
});
document.getElementById("explode").addEventListener("change", () => { frame(); setView(currentView); });

document.getElementById("edges").addEventListener("change", (e) => {
  parts.forEach((p) => { p.edges.visible = e.target.checked; });
});
document.getElementById("wall").addEventListener("change", (e) => {
  wall.visible = e.target.checked;
});

// ---- render loop ---------------------------------------------------------
function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const offset = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  controls.update();
  // Keep the main light over the viewer's shoulder so no side is ever dark.
  offset.set(0.2, 0, 0.5).multiplyScalar(camera.position.distanceTo(controls.target));
  key.position.copy(camera.position).add(offset);
  renderer.render(scene, camera);
});

loadModel().catch((err) => {
  document.getElementById("errorText").textContent = String(err.message || err);
  document.getElementById("error").style.display = "flex";
});
</script>
</body>
</html>
